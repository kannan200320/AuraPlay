<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Gamer Portal | Sign In | AuraPlay</title>
  <meta name="description" content="Sign in to your AuraPlay gamer account to reserve battlestations, claim member passes, and track tournament ranks.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    const savedDir = localStorage.getItem('site-dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00F0FF',
              'cyan-dark': '#0891B2',
              purple: '#8B5CF6',
              'purple-dark': '#6D28D9',
              pink: '#EC4899',
            },
            darkslate: {
              DEFAULT: '#0F172A',
              deep: '#090D16',
              card: '#131B2E',
              border: '#1E293B',
              lighter: '#1E293B',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            display: ['Rajdhani', 'Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 text-black dark:bg-darkslate-deep dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 antialiased selection:bg-cyan-500 selection:text-white py-6 sm:py-10 px-4">

  <!-- TOP BACK LINK -->
  

  <!-- AUTH MAIN CARD (Exact layout of reference images, rendered in AuraPlay brand theme) -->
  <main class="flex-1 flex items-center justify-center">
    <div class="w-full max-w-[460px] rounded-3xl bg-white dark:bg-darkslate-card border border-slate-200/90 dark:border-darkslate-border p-6 sm:p-8 shadow-2xl transition-all">
      
      <!-- Top Inside Header: Logo Center, Theme & RTL Top Right -->
      <div class="flex items-center justify-between pb-5 mb-5 border-b border-slate-100 dark:border-darkslate-border">
        <!-- Spacer for center alignment balance -->
        <div class="w-16"></div>

        <!-- Center Brand Logo -->
        <a href="index.html" class="flex items-center space-x-2.5 rtl:space-x-reverse group shrink-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
          </div>
          <span class="text-xl font-black font-display tracking-tight text-black dark:text-white">Aura<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-purple-500">Play</span></span>
        </a>

        <!-- Top Right Actions: Theme Toggle & RTL Toggle -->
        <div class="flex items-center space-x-1.5 rtl:space-x-reverse w-16 justify-end">
          <button type="button" class="theme-toggle-btn w-8 h-8 rounded-xl border border-slate-200 dark:border-darkslate-border bg-slate-50 dark:bg-darkslate-deep text-slate-700 dark:text-slate-300 hover:text-black dark:hover:text-white flex items-center justify-center transition-colors shadow-sm" aria-label="Toggle dark mode">
            <svg class="theme-sun-icon w-3.5 h-3.5 text-amber-400 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
            <svg class="theme-moon-icon w-3.5 h-3.5 text-slate-700 dark:text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
          </button>
          <button type="button" class="rtl-toggle-btn w-8 h-8 rounded-xl border border-slate-200 dark:border-darkslate-border bg-slate-50 dark:bg-darkslate-deep text-slate-700 dark:text-slate-300 hover:text-black dark:hover:text-white flex items-center justify-center transition-colors shadow-sm" aria-label="Toggle RTL layout">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
          </button>
        </div>
      </div>

      <!-- Card Title & Subtitle -->
      <div class="text-center space-y-1 mb-6">
        <h1 id="auth-heading" class="text-2xl sm:text-3xl font-black font-display text-black dark:text-white tracking-tight">Welcome Back</h1>
        <p id="auth-subheading" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-xs mx-auto leading-relaxed">
          Login to access your AuraPlay battlestation bookings, member passes, and gaming stats.
        </p>
      </div>

      <!-- Segmented Pill Tabs: Sign In | Register -->
      <div class="flex p-1 rounded-2xl bg-slate-100 dark:bg-darkslate-deep border border-slate-200 dark:border-darkslate-border mb-6">
        <button type="button" id="tab-btn-signin" class="flex-1 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all duration-200 bg-white dark:bg-darkslate-card text-cyan-600 dark:text-cyan-400 shadow-sm">
          Sign In
        </button>
        <button type="button" id="tab-btn-register" class="flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white">
          Register
        </button>
      </div>

      <!-- ================= SIGN IN FORM (MATCHING REFERENCE STRUCTURE 1) ================= -->
      <form id="form-signin" onsubmit="event.preventDefault(); return false;" class="space-y-4">
        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-black dark:text-slate-300 mb-1.5">EMAIL ADDRESS</label>
          <div class="relative">
            <input type="email" required placeholder="name@gmail.com" class="w-full px-4 py-3 pr-11 rtl:pr-4 rtl:pl-11 rounded-xl bg-white dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all">
            <div class="absolute right-3.5 rtl:right-auto rtl:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-black dark:text-slate-300 mb-1.5">PASSWORD</label>
          <div class="relative">
            <input type="password" id="signin-pwd" required placeholder="••••••••" class="w-full px-4 py-3 pr-11 rtl:pr-4 rtl:pl-11 rounded-xl bg-white dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all">
            <button type="button" class="pwd-toggle-btn absolute right-3.5 rtl:right-auto rtl:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black dark:hover:text-white focus:outline-none p-1" data-target="signin-pwd" aria-label="Toggle password visibility">
              <svg class="w-5 h-5 eye-open-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="w-5 h-5 eye-slash-icon hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-0.5">
          <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-cyan-500 focus:ring-cyan-500 accent-cyan-500">
            <span class="font-medium text-slate-700 dark:text-slate-300">Remember me</span>
          </label>
          <a href="#" onclick="return false;" class="font-semibold text-slate-600 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors">Forgot Password?</a>
        </div>

        <button type="submit" class="w-full py-3.5 px-4 rounded-xl text-sm font-extrabold uppercase text-white bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 transition-all shadow-lg shadow-cyan-500/25 tracking-wider transform hover:-translate-y-0.5">
          SIGN IN TO GAMER PORTAL
        </button>

        <div class="relative my-5">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200 dark:border-darkslate-border"></div>
          </div>
          <div class="relative flex justify-center text-[11px] uppercase">
            <span class="bg-white dark:bg-darkslate-card px-3 text-slate-500 dark:text-slate-400 font-bold tracking-wider">OR CONTINUE WITH</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="event.preventDefault(); if(window.showAuraPopup){window.showAuraPopup('Redirecting...', 'Connecting to Google authentication service...', true);}" class="flex items-center justify-center space-x-2 rtl:space-x-reverse py-3 px-4 rounded-xl border border-slate-300 dark:border-darkslate-border bg-white dark:bg-darkslate-deep hover:bg-slate-50 dark:hover:bg-darkslate-lighter text-xs font-bold text-black dark:text-white shadow-sm transition-all hover:scale-[1.02]">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" onclick="event.preventDefault(); if(window.showAuraPopup){window.showAuraPopup('Redirecting...', 'Connecting to Apple ID authentication service...', true);}" class="flex items-center justify-center space-x-2 rtl:space-x-reverse py-3 px-4 rounded-xl border border-slate-300 dark:border-darkslate-border bg-white dark:bg-darkslate-deep hover:bg-slate-50 dark:hover:bg-darkslate-lighter text-xs font-bold text-black dark:text-white shadow-sm transition-all hover:scale-[1.02]">
            <svg class="w-4 h-4 fill-current text-black dark:text-white" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.61 1.34-.56.63-1.05 1.66-.92 2.68 1 .08 2.01-.5 2.6-1.17z"/></svg>
            <span>Apple ID</span>
          </button>
        </div>

        <div class="text-center text-xs text-slate-600 dark:text-slate-400 pt-2">
          New to AuraPlay? <button type="button" class="switch-to-register-btn font-bold text-cyan-600 dark:text-cyan-400 hover:underline">Create Gamer Account</button>
        </div>
      </form>

      <!-- ================= REGISTER FORM (MATCHING REFERENCE STRUCTURE 2) ================= -->
      <form id="form-register" onsubmit="event.preventDefault(); return false;" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-black dark:text-slate-300 mb-1.5">NAME</label>
          <div class="relative">
            <input type="text" required minlength="2" pattern="[A-Za-z\s]{2,}" title="Name must contain at least 2 characters and no numbers" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" placeholder="Eleanor Jenkins" class="w-full px-4 py-3 pr-11 rtl:pr-4 rtl:pl-11 rounded-xl bg-white dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all">
            <div class="absolute right-3.5 rtl:right-auto rtl:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-black dark:text-slate-300 mb-1.5">EMAIL ADDRESS</label>
          <div class="relative">
            <input type="email" required placeholder="name@gmail.com" class="w-full px-4 py-3 pr-11 rtl:pr-4 rtl:pl-11 rounded-xl bg-white dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all">
            <div class="absolute right-3.5 rtl:right-auto rtl:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-black dark:text-slate-300 mb-1.5">PASSWORD (MIN 8 CHARACTERS)</label>
          <div class="relative">
            <input type="password" id="reg-pwd" required placeholder="••••••••" class="w-full px-4 py-3 pr-11 rtl:pr-4 rtl:pl-11 rounded-xl bg-white dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all">
            <button type="button" class="pwd-toggle-btn absolute right-3.5 rtl:right-auto rtl:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black dark:hover:text-white focus:outline-none p-1" data-target="reg-pwd" aria-label="Toggle password visibility">
              <svg class="w-5 h-5 eye-open-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="w-5 h-5 eye-slash-icon hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-black dark:text-slate-300 mb-1.5">CONFIRM PASSWORD</label>
          <div class="relative">
            <input type="password" id="reg-confirm-pwd" required placeholder="••••••••" class="w-full px-4 py-3 pr-11 rtl:pr-4 rtl:pl-11 rounded-xl bg-white dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all">
            <button type="button" class="pwd-toggle-btn absolute right-3.5 rtl:right-auto rtl:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-black dark:hover:text-white focus:outline-none p-1" data-target="reg-confirm-pwd" aria-label="Toggle password visibility">
              <svg class="w-5 h-5 eye-open-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="w-5 h-5 eye-slash-icon hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
            </button>
          </div>
        </div>

        <div class="text-xs pt-0.5">
          <label class="flex items-start space-x-2 rtl:space-x-reverse cursor-pointer">
            <input type="checkbox" required class="w-4 h-4 mt-0.5 rounded border-slate-300 text-purple-600 focus:ring-purple-500 accent-purple-600">
            <span class="text-slate-700 dark:text-slate-300 leading-snug">
              I agree to the AuraPlay <a href="coming-soon.html#guidelines" class="text-purple-600 dark:text-purple-400 font-bold hover:underline">Community Guidelines</a> & <a href="coming-soon.html#terms" class="text-purple-600 dark:text-purple-400 font-bold hover:underline">Terms of Service</a>.
            </span>
          </label>
        </div>

        <button type="submit" class="w-full py-3.5 px-4 rounded-xl text-sm font-extrabold uppercase text-white bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 transition-all shadow-lg shadow-purple-600/25 tracking-wider transform hover:-translate-y-0.5">
          CREATE GAMER ACCOUNT
        </button>

        <div class="relative my-5">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200 dark:border-darkslate-border"></div>
          </div>
          <div class="relative flex justify-center text-[11px] uppercase">
            <span class="bg-white dark:bg-darkslate-card px-3 text-slate-500 dark:text-slate-400 font-bold tracking-wider">OR SIGN UP WITH</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const heading = document.getElementById('auth-heading');
      const subheading = document.getElementById('auth-subheading');
      const tabSignIn = document.getElementById('tab-btn-signin');
      const tabRegister = document.getElementById('tab-btn-register');
      const formSignIn = document.getElementById('form-signin');
      const formRegister = document.getElementById('form-register');
      
      const toRegBtns = document.querySelectorAll('.switch-to-register-btn');
      const toSignBtns = document.querySelectorAll('.switch-to-signin-btn');

      function showSignIn() {
        tabSignIn.className = "flex-1 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all duration-200 bg-white dark:bg-darkslate-card text-cyan-600 dark:text-cyan-400 shadow-sm";
        tabRegister.className = "flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white";
        heading.textContent = "Welcome Back";
        subheading.textContent = "Login to access your AuraPlay battlestation bookings, member passes, and gaming stats.";
        formSignIn.classList.remove('hidden');
        formRegister.classList.add('hidden');
        window.history.replaceState(null, null, 'login.html');
      }

      function showRegister() {
        tabRegister.className = "flex-1 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all duration-200 bg-white dark:bg-darkslate-card text-purple-600 dark:text-purple-400 shadow-sm";
        tabSignIn.className = "flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-black dark:hover:text-white";
        heading.textContent = "Create Gamer Account";
        subheading.textContent = "Register a gamer portal account to track admissions, reservations, and leaderboards.";
        formRegister.classList.remove('hidden');
        formSignIn.classList.add('hidden');
        window.history.replaceState(null, null, '#register');
      }

      tabSignIn.addEventListener('click', showSignIn);
      tabRegister.addEventListener('click', () => {
        window.location.href = 'register.html';
      });
      toRegBtns.forEach(b => b.addEventListener('click', () => {
        window.location.href = 'register.html';
      }));
      toSignBtns.forEach(b => b.addEventListener('click', showSignIn));

      // Handle initial hash
      if (window.location.hash === '#register') {
        showRegister();
      }

      // Password visibility toggle with icon switch
      document.querySelectorAll('.pwd-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            const isPwd = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPwd ? 'text' : 'password');
            const openIcon = btn.querySelector('.eye-open-icon');
            const slashIcon = btn.querySelector('.eye-slash-icon');
            if (openIcon && slashIcon) {
              if (isPwd) {
                openIcon.classList.add('hidden');
                slashIcon.classList.remove('hidden');
                btn.classList.add('text-cyan-500');
              } else {
                openIcon.classList.remove('hidden');
                slashIcon.classList.add('hidden');
                btn.classList.remove('text-cyan-500');
              }
            }
          }
        });
      });
    });
  </script>
</body>
