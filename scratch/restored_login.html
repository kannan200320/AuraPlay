<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Gamer Portal Login & Register | AuraPlay</title>
  <meta name="description" content="Sign in to your AuraPlay gamer account to manage battlestation reservations, hour top-ups, and tournament passes.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    const savedDir = localStorage.getItem('site-dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00F0FF',
              'cyan-dark': '#0891B2',
              purple: '#8B5CF6',
              'purple-dark': '#6D28D9',
              pink: '#EC4899',
              emerald: '#10B981',
              amber: '#F59E0B',
            },
            darkslate: {
              DEFAULT: '#0F172A',
              deep: '#090D16',
              card: '#131B2E',
              border: '#1E293B',
              lighter: '#1E293B',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            display: ['Rajdhani', 'Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-black dark:text-slate-200 dark:bg-darkslate-deep dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 antialiased selection:bg-cyan-500 selection:text-white">

  <!-- TOP HEADER STRIP -->
  <header class="w-full bg-white/80 dark:bg-darkslate-card/80 backdrop-blur border-b border-slate-200 dark:border-darkslate-border py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 rtl:space-x-reverse group whitespace-nowrap">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-cyan-500/25 group-hover:scale-105 transition-transform duration-300 shrink-0">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
        </div>
        <span class="text-2xl font-black tracking-tight text-black dark:text-white font-display uppercase leading-none">
          Aura<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-purple-500">Play</span>
        </span>
      </a>

      <div class="flex items-center space-x-3 rtl:space-x-reverse">
        <button type="button" class="rtl-toggle-btn px-3 py-1.5 text-xs font-bold rounded-xl border border-slate-200 dark:border-darkslate-border bg-slate-100 dark:bg-darkslate-deep text-black dark:text-slate-300">
          <span class="rtl-status-text">RTL</span>
        </button>
        <button type="button" class="theme-toggle-btn p-2 rounded-xl border border-slate-200 dark:border-darkslate-border bg-slate-100 dark:bg-darkslate-deep text-black dark:text-slate-300">
          <svg class="theme-sun-icon w-4 h-4 text-amber-400 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
          <svg class="theme-moon-icon w-4 h-4 text-black dark:text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
        </button>
        <a href="index.html" class="text-xs font-bold text-black dark:text-slate-300 hover:text-cyan-500">Back to Arena →</a>
      </div>
    </div>
  </header>

  <!-- AUTH MAIN -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="w-full max-w-md rounded-3xl bg-white dark:bg-darkslate-card border border-slate-200 dark:border-darkslate-border p-6 sm:p-8 shadow-2xl space-y-6">
      
      <!-- Logo & Title -->
      <div class="text-center space-y-1">
        <h2 class="text-2xl font-black font-display uppercase text-black dark:text-white">Gamer Portal</h2>
        <p class="text-xs text-black dark:text-slate-400">Sign in to claim station hours, bookings, and rewards.</p>
      </div>

      <!-- Auth Tabs -->
      <div class="flex p-1 rounded-2xl bg-slate-100 dark:bg-darkslate-deep border border-slate-200 dark:border-darkslate-border text-xs font-bold">
        <button type="button" id="tab-login-btn" class="flex-1 py-2 rounded-xl bg-white dark:bg-darkslate-card text-black dark:text-white shadow-sm">
          Sign In
        </button>
        <button type="button" id="tab-register-btn" class="flex-1 py-2 rounded-xl text-black dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          Create Account
        </button>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-3 text-xs font-bold">
        <button type="button" onclick="window.location.href='dashboard.html'" class="p-3 rounded-xl border border-slate-200 dark:border-darkslate-border hover:border-cyan-500 flex items-center justify-center space-x-2 rtl:space-x-reverse text-black dark:text-slate-200 bg-slate-50 dark:bg-darkslate-deep transition-colors">
          <span>🎮</span>
          <span>Steam</span>
        </button>
        <button type="button" onclick="window.location.href='dashboard.html'" class="p-3 rounded-xl border border-slate-200 dark:border-darkslate-border hover:border-purple-500 flex items-center justify-center space-x-2 rtl:space-x-reverse text-black dark:text-slate-200 bg-slate-50 dark:bg-darkslate-deep transition-colors">
          <span>👾</span>
          <span>Discord</span>
        </button>
      </div>

      <div class="flex items-center space-x-3 text-xs text-black dark:text-slate-400">
        <div class="flex-1 border-t border-slate-200 dark:border-darkslate-border"></div>
        <span>or with email</span>
        <div class="flex-1 border-t border-slate-200 dark:border-darkslate-border"></div>
      </div>

      <!-- Sign In Form -->
      <form id="login-form" data-aura-form data-success-msg="Signed in successfully!" onsubmit="setTimeout(()=>window.location.href='dashboard.html', 300)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-black dark:text-slate-300 mb-1">GamerTag or Email</label>
          <input type="text" required value="PhoenixAim" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold uppercase text-black dark:text-slate-300">Password</label>
            <a href="#" class="text-[11px] text-cyan-500 hover:underline">Forgot?</a>
          </div>
          <input type="password" required value="••••••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
        </div>
        <div class="flex items-center text-xs">
          <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 text-cyan-500 rounded accent-cyan-500">
            <span class="text-black dark:text-slate-400">Remember on this battlestation</span>
          </label>
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl text-sm font-extrabold text-white bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 shadow-lg shadow-cyan-500/20">
          Enter Arena Dashboard
        </button>
      </form>

      <!-- Register Form (Hidden by default) -->
      <form id="register-form" data-aura-form data-success-msg="Gamer profile created! Welcome to AuraPlay." onsubmit="setTimeout(()=>window.location.href='dashboard.html', 800)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-black dark:text-slate-300 mb-1">Choose GamerTag</label>
          <input type="text" required placeholder="e.g. ApexPredator" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-black dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" required placeholder="gamer@auraplay.gg" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-black dark:text-slate-300 mb-1">Create Password</label>
          <input type="password" required placeholder="At least 8 characters" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-darkslate-deep border border-slate-300 dark:border-darkslate-border text-sm text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl text-sm font-extrabold text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 shadow-lg shadow-purple-600/20">
          Create Gamer Account
        </button>
      </form>

    </div>
  </main>

  <!-- SIMPLE FOOTER -->
  <footer class="w-full py-4 text-center text-xs text-black dark:text-slate-400 border-t border-slate-200 dark:border-darkslate-border">
    © 2026 AuraPlay Gaming Lounge LLC. Built for champions.
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginTab = document.getElementById('tab-login-btn');
      const registerTab = document.getElementById('tab-register-btn');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');

      loginTab.addEventListener('click', () => {
        loginTab.classList.add('bg-white', 'dark:bg-darkslate-card', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        loginTab.classList.remove('text-black dark:text-slate-400', 'dark:text-slate-400');
        registerTab.classList.remove('bg-white', 'dark:bg-darkslate-card', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        registerTab.classList.add('text-black dark:text-slate-400', 'dark:text-slate-400');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      });

      registerTab.addEventListener('click', () => {
        registerTab.classList.add('bg-white', 'dark:bg-darkslate-card', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        registerTab.classList.remove('text-black dark:text-slate-400', 'dark:text-slate-400');
        loginTab.classList.remove('bg-white', 'dark:bg-darkslate-card', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        loginTab.classList.add('text-black dark:text-slate-400', 'dark:text-slate-400');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
